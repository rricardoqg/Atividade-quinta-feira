<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Fundo escuro com gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #0d0d0d; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #1a1c1f; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #FFB800; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #FFC933; stop-opacity: 1" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Elementos decorativos de fundo -->
  <circle cx="150" cy="150" r="120" fill="rgba(255, 184, 0, 0.05)" />
  <circle cx="1050" cy="500" r="150" fill="rgba(255, 184, 0, 0.08)" />
  <rect
    x="0"
    y="0"
    width="1200"
    height="2"
    fill="url(#accentGradient)"
  />

  <!-- Logo/Branding -->
  <g id="logo">
    <!-- Bracket esquerdo -->
    <text
      x="60"
      y="120"
      font-family="Arial, sans-serif"
      font-size="72"
      font-weight="bold"
      fill="#FFB800"
    >
      [
    </text>

    <!-- Texto JRK -->
    <text
      x="120"
      y="120"
      font-family="Arial, sans-serif"
      font-size="72"
      font-weight="900"
      fill="#FFFFFF"
      letter-spacing="8"
    >
      JRK
    </text>

    <!-- Bracket direito -->
    <text
      x="480"
      y="120"
      font-family="Arial, sans-serif"
      font-size="72"
      font-weight="bold"
      fill="#FFB800"
    >
      ]
    </text>

    <!-- Sublinha -->
    <line x1="120" y1="145" x2="480" y2="145" stroke="#FFB800" stroke-width="4" />
  </g>

  <!-- Texto principal -->
  <text
    x="60"
    y="240"
    font-family="Arial, sans-serif"
    font-size="56"
    font-weight="bold"
    fill="#FFFFFF"
    line-height="1.2"
  >
    Usinagem em Campo
  </text>

  <text
    x="60"
    y="310"
    font-family="Arial, sans-serif"
    font-size="56"
    font-weight="bold"
    fill="#FFFFFF"
    line-height="1.2"
  >
    Onde Sua Máquina
  </text>

  <text
    x="60"
    y="380"
    font-family="Arial, sans-serif"
    font-size="56"
    font-weight="bold"
    fill="#FFB800"
    line-height="1.2"
  >
    Estiver.
  </text>

  <!-- Descrição -->
  <text
    x="60"
    y="450"
    font-family="Arial, sans-serif"
    font-size="28"
    fill="#8A8F97"
  >
    Especialistas em Recuperação de Máquinas Pesadas
  </text>

  <!-- Estatísticas -->
  <g id="stats">
    <!-- Stat 1 -->
    <circle
      cx="200"
      cy="550"
      r="40"
      fill="rgba(255, 184, 0, 0.15)"
      stroke="#FFB800"
      stroke-width="2"
    />
    <text
      x="200"
      y="560"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold"
      fill="#FFB800"
      text-anchor="middle"
    >
      15+
    </text>

    <text
      x="270"
      y="535"
      font-family="Arial, sans-serif"
      font-size="16"
      fill="#FFFFFF"
    >
      Anos
    </text>
    <text
      x="270"
      y="560"
      font-family="Arial, sans-serif"
      font-size="16"
      fill="#8A8F97"
    >
      de experiência
    </text>

    <!-- Stat 2 -->
    <circle
      cx="650"
      cy="550"
      r="40"
      fill="rgba(255, 184, 0, 0.15)"
      stroke="#FFB800"
      stroke-width="2"
    />
    <text
      x="650"
      y="560"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold"
      fill="#FFB800"
      text-anchor="middle"
    >
      800+
    </text>

    <text
      x="720"
      y="535"
      font-family="Arial, sans-serif"
      font-size="16"
      fill="#FFFFFF"
    >
      Máquinas
    </text>
    <text
      x="720"
      y="560"
      font-family="Arial, sans-serif"
      font-size="16"
      fill="#8A8F97"
    >
      recuperadas
    </text>

    <!-- Stat 3 -->
    <circle
      cx="1100"
      cy="550"
      r="40"
      fill="rgba(255, 184, 0, 0.15)"
      stroke="#FFB800"
      stroke-width="2"
    />
    <text
      x="1100"
      y="560"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold"
      fill="#FFB800"
      text-anchor="middle"
    >
      24h
    </text>

    <text
      x="1170"
      y="535"
      font-family="Arial, sans-serif"
      font-size="16"
      fill="#FFFFFF"
    >
      Atendimento
    </text>
    <text
      x="1170"
      y="560"
      font-family="Arial, sans-serif"
      font-size="16"
      fill="#8A8F97"
    >
      quando necessário
    </text>
  </g>

  <!-- URL -->
  <text
    x="1140"
    y="610"
    font-family="Arial, sans-serif"
    font-size="14"
    fill="#8A8F97"
    text-anchor="end"
  >
    jrkusinagem.com.br
  </text>
</svg>
